[metadata]
name = isaac-policy-export
version = 0.1.0
description = Exporter for Isaac Lab policy bundles consumed by isaac_policy_runtime.
long_description = file: README.md
long_description_content_type = text/markdown
license = BSD-3-Clause

[options]
packages = find:
python_requires = >=3.10
install_requires =
    setuptools

[options.entry_points]
console_scripts =
    isaac-export-bundle = isaac_policy_export.export_bundle:main
