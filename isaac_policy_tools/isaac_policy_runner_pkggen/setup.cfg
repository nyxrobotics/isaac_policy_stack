[metadata]
name = isaac-policy-runner-pkggen
version = 0.1.0
description = Generate <robot>_isaac_policy_runner ROS 2 ament_python packages with launch files.
long_description = file: README.md
long_description_content_type = text/markdown
license = BSD-3-Clause

[options]
packages = find:
python_requires = >=3.10
install_requires =
    setuptools

[options.entry_points]
console_scripts =
    isaac-generate-runner-pkg = isaac_policy_runner_pkggen.generate_runner_pkg:main
