[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isaac-policy-runner-pkggen"
version = "0.1.0"
description = "Generate <robot>_isaac_policy_runner ROS 2 ament_python packages with launch files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
isaac-generate-runner-pkg = "isaac_policy_runner_pkggen.generate_runner_pkg:main"

[tool.setuptools]
packages = ["isaac_policy_runner_pkggen"]
